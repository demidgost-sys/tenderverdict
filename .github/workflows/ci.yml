name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  public-tree:
    name: Public tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate exact allow-list
        run: python tools/check_public_tree.py

  security:
    name: Release security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Scan candidate content and metadata
        run: python tools/security_scan.py

      - name: Create source archive from the tested commit
        run: git archive --format=tar --output "${RUNNER_TEMP}/candidate.tar" HEAD

      - name: Extract source archive
        run: |
          mkdir "${RUNNER_TEMP}/candidate"
          tar -xf "${RUNNER_TEMP}/candidate.tar" -C "${RUNNER_TEMP}/candidate"

      - name: Rescan exact source archive
        run: python tools/security_scan.py --root "${RUNNER_TEMP}/candidate"

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run offline unit and integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned type checker
        run: python -m pip install mypy==2.3.0

      - name: Type-check the product package
        run: mypy

  package:
    name: Build and clean-wheel smoke test
    needs: [public-tree, security, tests, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r requirements-package-build.txt
          python -m pip check

      - name: Build wheel and source distribution
        run: python -m build --no-isolation

      - name: Validate exact source distribution tree
        shell: bash
        run: |
          mkdir "${RUNNER_TEMP}/sdist-check"
          tar -xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist-check"
          sdist_root="$(find "${RUNNER_TEMP}/sdist-check" -mindepth 1 -maxdepth 1 \
            -type d -name 'tenderverdict-*' -print -quit)"
          test -n "${sdist_root}"
          python tools/check_public_tree.py --root "${sdist_root}" --sdist
          python tools/security_scan.py --root "${sdist_root}" --sdist

      - name: Create isolated smoke-test environment
        run: python -m venv "${RUNNER_TEMP}/tenderverdict-smoke"

      - name: Install built wheel
        run: >-
          "${RUNNER_TEMP}/tenderverdict-smoke/bin/python"
          -m pip install --no-deps dist/*.whl

      - name: Verify installed desktop entry point is headless
        run: >-
          "${RUNNER_TEMP}/tenderverdict-smoke/bin/python" -c
          "import importlib.metadata as m, sys;
          points = [p for p in m.entry_points(group='gui_scripts') if p.name == 'tenderverdict-desktop'];
          assert len(points) == 1 and points[0].value == 'tenderverdict.desktop:main';
          import tenderverdict.desktop;
          assert 'tkinter' not in sys.modules and 'tenderverdict.ted' not in sys.modules"

      - name: Run installed offline demo
        run: >-
          "${RUNNER_TEMP}/tenderverdict-smoke/bin/tenderverdict" demo
          --format markdown --output "${RUNNER_TEMP}/demo.md"

      - name: Run installed offline qualification
        run: >-
          "${RUNNER_TEMP}/tenderverdict-smoke/bin/tenderverdict" qualify
          --profile examples/synthetic/profile.json
          --notices examples/synthetic/notices.csv
          --as-of 2026-08-02 --format json
          --output "${RUNNER_TEMP}/report.json"

      - name: Confirm smoke-test outputs
        run: test -s "${RUNNER_TEMP}/demo.md" && test -s "${RUNNER_TEMP}/report.json"
